version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    monthly-action-updates:
      applies-to: version-updates
      patterns:
        - "*"
- package-ecosystem: bundler
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    monthly-bundler-updates:
      applies-to: version-updates
      patterns:
        - "*"