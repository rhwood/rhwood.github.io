name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [ "main" ]
    # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build job
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Jekyll warnings
        run: bundle exec jekyll doctor
      - name: Test links
        # Ignore 302 (redirects), 403 (forbidden), 406 (not acceptable), 418 (I'm a teapot),
        # 503 (service unavailable), and 999 (LinkedIn's "bot detected" status code)
        # Manual testing should not ignore these status codes, but for automated testing, we
        # want to avoid false positives from sites that block bots or have temporary redirects.
        run: bundle exec htmlproofer --ignore-status-codes "302,403,406,418,503,999" ./_site
